# Local-only development credentials and test-only keys. They grant access to nothing outside a
# developer's own machine or a throwaway test container.
[extend]
useDefault = true

[allowlist]
description = "Local development service credentials"
paths = [
  '''infra/dev/seaweedfs-s3\.json''',
  '''apps/api/\.env\.example''',
  '''apps/api/vitest\.config\.mts''',
  '''apps/api/src/config/config\.schema\.spec\.ts''',
  '''docker-compose\.yml''',
  '''apps/web/playwright\.config\.ts''',
  '''\.github/workflows/ci\.yml''',
]
