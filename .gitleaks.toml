# Local-only development credentials for Docker services. They grant access to nothing outside
# a developer's own machine and are documented in docker-compose.yml.
[extend]
useDefault = true

[allowlist]
description = "Local development service credentials"
paths = [
  '''infra/dev/seaweedfs-s3\.json''',
  '''apps/api/\.env\.example''',
  '''docker-compose\.yml''',
]
